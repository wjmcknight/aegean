directory: ~/Music

import:
  write: yes

  move: yes
  copy: no
  delete: no

  autotag: yes
  timid: no

  resume: ask
  incremental: no
  none_rec_action: ask
  log:

  quiet: no
  quiet_fallback: skip
  default_action: apply

  singletons: no
  languages: []
  detail: no
  flat: no

original_date: no
per_disk_numbering: no
clutter: ["Thumbs.db", ".DS_Store", "*.m3u", "*.jpg"]

plugins: [scrub, mbsync]

scrub:
    auto: yes
