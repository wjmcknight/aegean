[env]
TERM = "xterm-256color"

[font]
normal      = { family = "Adwaita Mono", style = "Regular" }
bold        = { style = "Regular" }
bold_italic = { style = "Regular" }
italic      = { style = "Regular" }
size        = 11.0

[window]
decorations_theme_variant = "Dark"
dimensions                = { columns = 80, lines = 24 }
padding                   = { x = 2, y = 0 }
title                     = "Terminal"

[mouse]
hide_when_typing = true

[general]
import = ["~/.config/alacritty/colors/base16-eighties.toml"]
